# Builds the site and deploys it to Firebase Hosting on every push to main.
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT (JSON key for a
# service account with the "Firebase Hosting Admin" role). Project ID is in
# .firebaserc.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: firebase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python build.py
      - name: Deploy to Firebase Hosting
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@latest deploy --only hosting --non-interactive 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/sa.json"
          if [ "$code" -ne 0 ]; then
            # Surface the error as an annotation (visible on the run summary page).
            msg=$(grep -iE 'error|denied|permission|failed|not found' deploy.log | tail -8 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Firebase deploy failed::${msg:-see log}"
            exit "$code"
          fi
